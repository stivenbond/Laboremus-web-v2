name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # We will need docker to run testcontainers
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Lint
      run: npm run lint
      
    - name: Type Check
      run: npm run type-check
      
    - name: Run Integration Tests
      run: npm run test
      
    - name: Build Next.js Application
      run: npm run build
      env:
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        BETTER_AUTH_SECRET: "local_better_auth_dev_secret_32_chars_long"
        BETTER_AUTH_URL: "http://localhost:3000"
        CRON_SECRET: "super_secret_cron_job_auth_token_value"
        AI_MODEL: "gemini-1.5-flash"
